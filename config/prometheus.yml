global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot Actuator endpoints
  - job_name: "prism-auth"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8081","localhost:8081"]

  - job_name: "prism-catalog"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8082","localhost:8082"]

  - job_name: "prism-upload"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8083","localhost:8083"]

  - job_name: "prism-transcoder"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8084","localhost:8084"]

  - job_name: "prism-stream"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8085","localhost:8085"]

  - job_name: "prism-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080","localhost:8080"]

  - job_name: "prism-config"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8888","localhost:8888"]

  - job_name: "prism-discovery"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8761","localhost:8761"]
