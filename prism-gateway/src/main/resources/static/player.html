<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prism Video Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.14/dist/hls.min.js"></script>
    <style>
      :root {
        --bg: #0b1c2c;
        --panel: #0f2438;
        --accent: #1f9e6d;
        --text: #e7f0f5;
        --muted: #92a8b6;
        --border: #1c3347;
        --danger: #f25f5c;
        font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: radial-gradient(
            circle at 20% 20%,
            rgba(31, 158, 109, 0.2),
            transparent 35%
          ),
          radial-gradient(
            circle at 80% 0%,
            rgba(46, 91, 173, 0.25),
            transparent 32%
          ),
          #0b1c2c;
        min-height: 100vh;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px;
        display: flex;
        justify-content: center;
      }
      .card {
        width: min(1100px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 12px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p.lead {
        margin: 0 0 24px;
        color: var(--muted);
      }
      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        align-items: end;
      }
      label {
        font-size: 14px;
        color: var(--muted);
        display: block;
        margin-bottom: 6px;
      }
      input,
      button,
      select {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 10px;
        color: var(--muted);
        font-size: 14px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        color: var(--muted);
        font-size: 14px;
      }
      .meta span {
        padding: 6px 10px;
        background: #0c2032;
        border-radius: 9px;
        border: 1px solid var(--border);
      }
      @media (max-width: 720px) {
        body {
          padding: 16px;
        }
        form {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Prism Stream Player</h1>
      <p class="lead">
        Enter an API key and video ID. The player calls the Stream service smart
        proxy, which fetches HLS from MinIO and streams it through the service
        (no redirects).
      </p>

      <form id="player-form">
        <div>
          <label for="base-url">Gateway Base URL</label>
          <input
            id="base-url"
            name="base-url"
            type="url"
            placeholder="http://localhost:8080"
            autocomplete="url"
            required
          />
        </div>
        <div>
          <label for="video-id">Video ID</label>
          <input
            id="video-id"
            name="video-id"
            type="text"
            placeholder="vid_..."
            autocomplete="off"
            required
          />
        </div>
        <div>
          <label for="api-key">X-API-Key (videos:read)</label>
          <input
            id="api-key"
            name="api-key"
            type="text"
            placeholder="pk_xxx:sk_xxx"
            autocomplete="off"
          />
        </div>
        <div
          class="row"
          style="justify-content: space-between; gap: 12px; flex-wrap: wrap"
        >
          <label class="checkbox" for="public-toggle">
            <input id="public-toggle" name="public-toggle" type="checkbox" />
            Use public endpoint (no API key)
          </label>
          <button type="submit">Load & Play</button>
        </div>
      </form>

      <div id="status" class="status">Waiting for input.</div>

      <video
        id="player"
        controls
        playsinline
        preload="auto"
        crossorigin="anonymous"
        webkit-playsinline
      ></video>

      <div class="meta" id="meta"></div>
    </main>

    <script>
      const form = document.getElementById("player-form");
      const baseInput = document.getElementById("base-url");
      const videoIdInput = document.getElementById("video-id");
      const apiKeyInput = document.getElementById("api-key");
      const publicToggle = document.getElementById("public-toggle");
      const statusEl = document.getElementById("status");
      const metaEl = document.getElementById("meta");
      const videoEl = document.getElementById("player");

      let hlsInstance;

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("negative", isError);
      }

      function setMeta(items = []) {
        metaEl.innerHTML = items.map((t) => `<span>${t}</span>`).join("");
      }

      function cleanupPlayer() {
        if (hlsInstance) {
          hlsInstance.destroy();
          hlsInstance = null;
        }
        videoEl.pause();
        videoEl.removeAttribute("src");
        videoEl.load();
      }

      function buildEndpoint(baseUrl, videoId, isPublic) {
        const trimmedBase = baseUrl.endsWith("/")
          ? baseUrl.slice(0, -1)
          : baseUrl;
        const path = isPublic
          ? `/stream/public/${encodeURIComponent(videoId)}/master.m3u8`
          : `/stream/${encodeURIComponent(videoId)}/master.m3u8`;
        return `${trimmedBase}${path}`;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const videoId = videoIdInput.value.trim();
        const apiKey = apiKeyInput.value.trim();
        const isPublic = publicToggle.checked;
        const baseUrl = baseInput.value.trim() || window.location.origin;

        if (!videoId) {
          setStatus("Please enter a video ID.", true);
          return;
        }
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const videoId = videoIdInput.value.trim();
          const apiKey = apiKeyInput.value.trim();
          const isPublic = publicToggle.checked;
          const baseUrl = baseInput.value.trim() || window.location.origin;
  
          if (!videoId) {
            setStatus("Please enter a video ID.", true);
            return;
          }
          if (!isPublic && !apiKey) {
            setStatus("Provide an API key or switch to public mode.", true);
            return;
          }
  
          const endpoint = buildEndpoint(baseUrl, videoId, isPublic);
          cleanupPlayer();
          setStatus(`Requesting manifest from ${endpoint}`);
          setMeta([`Mode: ${isPublic ? "public" : "private"}`]);
  
          try {
            if (Hls.isSupported()) {
              // Minimal, single-level playback (no ABR, no worker)
              hlsInstance = new Hls({
                debug: true,
                enableWorker: false,
                autoStartLoad: true,
                startLevel: -1,
                xhrSetup: (xhr) => {
                  if (!isPublic && apiKey) {
                    xhr.setRequestHeader("X-API-Key", apiKey);
                  }
                },
              });
  
              hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                const levels = hlsInstance.levels || [];
                const targetLevel = levels.length ? levels.length - 1 : -1; // highest available
                hlsInstance.autoLevelEnabled = false;
                hlsInstance.startLevel = targetLevel;
                hlsInstance.nextLevel = targetLevel;
                hlsInstance.currentLevel = targetLevel;
                setStatus("Manifest loaded. Starting playback...");
                videoEl.volume = 1.0;
                videoEl.muted = false;
                videoEl
                  .play()
                  .catch(() =>
                    setStatus("Manifest loaded. Press play to start.", false)
                  );
              });
  
              hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                console.error("HLS Error:", data);
                if (data.fatal) {
                  hlsInstance.destroy();
                  setStatus(
                    `Fatal error: ${data?.details || data?.type || "unknown"}`,
                    true
                  );
                }
              });
  
              hlsInstance.loadSource(endpoint);
              hlsInstance.attachMedia(videoEl);
              setMeta([
                `Mode: ${isPublic ? "public" : "private"}`,
                `Proxy endpoint: ${endpoint}`,
              ]);
            } else {
              // Native HLS (Safari): stream directly from proxy endpoint
              videoEl.src = endpoint;
              await videoEl.play();
              setStatus("Streaming via native HLS (proxy endpoint).");
              setMeta([
                `Mode: ${isPublic ? "public" : "private"}`,
                `Proxy endpoint: ${endpoint}`,
              ]);
            }
          } catch (err) {
            console.error(err);
            setStatus(`Error: ${err.message || err}`, true);
          }
        });
      });
    </script>
  </body>
</html>
