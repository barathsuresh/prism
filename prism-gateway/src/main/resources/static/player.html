<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prism Video Player</title>

    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0b1c2c;
        --panel: #0f2438;
        --accent: #1f9e6d;
        --text: #e7f0f5;
        --muted: #92a8b6;
        --border: #1c3347;
        --danger: #f25f5c;
        font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: radial-gradient(
            circle at 20% 20%,
            rgba(31, 158, 109, 0.2),
            transparent 35%
          ),
          radial-gradient(
            circle at 80% 0%,
            rgba(46, 91, 173, 0.25),
            transparent 32%
          ),
          #0b1c2c;
        min-height: 100vh;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        width: min(1000px, 100%);
        background: rgba(15, 36, 56, 0.95);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }

      h1 {
        margin: 0 0 12px;
        font-weight: 600;
        font-size: 28px;
        background: linear-gradient(to right, #fff, #92a8b6);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p.lead {
        margin: 0 0 32px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }

      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        align-items: end;
        margin-bottom: 32px;
      }

      label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      input,
      button {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 14px 16px;
        font-size: 14px;
        font-family: inherit;
        background: #081624;
        color: var(--text);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
        background: #0c2032;
        box-shadow: 0 0 0 4px rgba(31, 158, 109, 0.1);
      }

      button {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        border: none;
        letter-spacing: 0.5px;
      }

      button:hover {
        background: #25bb82;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(31, 158, 109, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      .checkbox-wrapper {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 4px 0;
        cursor: pointer;
      }

      .checkbox-wrapper input[type="checkbox"] {
        width: 20px;
        height: 20px;
        margin: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }

      .checkbox-wrapper label {
        margin: 0;
        text-transform: none;
        letter-spacing: 0;
        font-size: 14px;
        color: var(--text);
        cursor: pointer;
      }

      #status-bar {
        padding: 16px;
        background: #081624;
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 24px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.3s ease;
      }

      #status-bar.success {
        border-color: var(--accent);
        background: rgba(31, 158, 109, 0.05);
        color: var(--accent);
      }
      #status-bar.error {
        border-color: var(--danger);
        background: rgba(242, 95, 92, 0.05);
        color: var(--danger);
      }

      /* Video Container */
      .video-wrapper {
        border-radius: 16px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border);
        aspect-ratio: 16 / 9;
        position: relative;
      }

      .quality-selector {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 100;
      }

      .quality-selector select {
        padding: 10px 16px;
        background: rgba(8, 22, 36, 0.95);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .quality-selector select:hover {
        border-color: var(--accent);
        background: rgba(8, 22, 36, 1);
      }

      .quality-selector select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(31, 158, 109, 0.2);
      }

      .video-js {
        width: 100%;
        height: 100%;
      }

      /* Customizing Video.js Skin */
      .video-js .vjs-big-play-button {
        background: var(--accent) !important;
        border: none !important;
        width: 80px !important;
        height: 80px !important;
        line-height: 80px !important;
        font-size: 40px !important;
        border-radius: 50% !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%);
        margin: 0 !important;
        transition: all 0.2s ease;
      }

      .video-js .vjs-big-play-button:hover {
        background: #25bb82 !important;
        transform: translate(-50%, -50%) scale(1.1);
      }

      .video-js .vjs-control-bar {
        background: rgba(8, 22, 36, 0.9);
      }

      .video-js .vjs-slider {
        background-color: rgba(255, 255, 255, 0.2);
      }

      /* Stats Grid */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-top: 24px;
      }

      .stat-box {
        background: #081624;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
      }

      .stat-title {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 1px;
        margin-bottom: 6px;
      }

      .stat-content {
        font-size: 14px;
        color: var(--accent);
        font-family: monospace;
        word-break: break-all;
      }

      @media (max-width: 768px) {
        body {
          padding: 16px;
        }
        .card {
          padding: 20px;
        }
        h1 {
          font-size: 24px;
        }
        form {
          grid-template-columns: 1fr;
        }
        .stats-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <main class="card">
      <h1>🎬 Prism Player</h1>
      <p class="lead">
        Secure HLS streaming interface for the Prism Distributed Platform.
      </p>

      <form id="player-form">
        <div>
          <label for="base-url">Gateway URL</label>
          <input id="base-url" type="url" placeholder="http://..." required />
        </div>

        <div>
          <label for="video-id">Video ID</label>
          <input id="video-id" type="text" placeholder="vid_..." required />
        </div>

        <div>
          <label for="api-key">API Key</label>
          <input id="api-key" type="text" placeholder="pk_live_..." />
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px">
          <div class="checkbox-wrapper">
            <input id="public-toggle" type="checkbox" />
            <label for="public-toggle">Use Public Endpoint</label>
          </div>
          <button type="submit">▶ Load Stream</button>
        </div>
      </form>

      <div id="status-bar">
        <span id="status-icon">⚪</span>
        <span id="status-text">System Ready</span>
      </div>

      <div class="video-wrapper">
        <div class="quality-selector">
          <select id="quality-select">
            <option value="auto">Auto (ABR)</option>
          </select>
        </div>
        <video
          id="player"
          class="video-js vjs-big-play-centered"
          controls
          preload="auto"
          playsinline
        ></video>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-title">Stream URL</div>
          <div class="stat-content" id="url-display">-</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">Current Quality</div>
          <div class="stat-content" id="quality-display">-</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">Bitrate</div>
          <div class="stat-content" id="bitrate-display">-</div>
        </div>
        <div class="stat-box">
          <div class="stat-title">Buffer Health</div>
          <div class="stat-content" id="buffer-display">-</div>
        </div>
      </div>
    </main>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
      const form = document.getElementById("player-form");
      const baseInput = document.getElementById("base-url");
      const statusText = document.getElementById("status-text");
      const statusIcon = document.getElementById("status-icon");
      const statusBar = document.getElementById("status-bar");
      const urlDisplay = document.getElementById("url-display");
      const qualitySelect = document.getElementById("quality-select");
      const qualityDisplay = document.getElementById("quality-display");
      const bitrateDisplay = document.getElementById("bitrate-display");
      const bufferDisplay = document.getElementById("buffer-display");

      let player = null;
      let statsInterval = null;

      // 1. Auto-Detect Gateway URL
      (function detectUrl() {
        const proto = window.location.protocol;
        if (proto.startsWith("http")) {
          baseInput.value = window.location.origin;
        } else {
          baseInput.value = "http://localhost:8080";
        }
      })();

      // 2. Helper to update UI Status
      function setStatus(msg, type = "neutral") {
        statusText.textContent = msg;
        statusBar.className = type;
        if (type === "success") statusIcon.textContent = "🟢";
        else if (type === "error") statusIcon.textContent = "🔴";
        else statusIcon.textContent = "⚪";
      }

      // 3. Update Stats Display
      function updateStats() {
        if (!player) return;

        try {
          const qualityLevels = player.qualityLevels();
          const selectedIndex = player.qualityLevels().selectedIndex;

          if (qualityLevels && selectedIndex >= 0) {
            const currentLevel = qualityLevels[selectedIndex];

            // Current quality
            if (currentLevel && currentLevel.height) {
              qualityDisplay.textContent = `${currentLevel.height}p`;
            }

            // Bitrate
            if (currentLevel && currentLevel.bandwidth) {
              bitrateDisplay.textContent = `${(
                currentLevel.bandwidth / 1000000
              ).toFixed(1)} Mbps`;
            }
          }

          // Buffer health
          const buffered = player.buffered();
          if (buffered.length > 0) {
            const bufferEnd = buffered.end(buffered.length - 1);
            const currentTime = player.currentTime();
            const bufferLength = Math.max(0, bufferEnd - currentTime);
            bufferDisplay.textContent = `${bufferLength.toFixed(1)}s`;
          }
        } catch (err) {
          console.debug("Stats update:", err.message);
        }
      }

      // 4. Populate Quality Selector
      function populateQualitySelector() {
        try {
          const qualityLevels = player.qualityLevels();

          if (qualityLevels && qualityLevels.length > 0) {
            // Clear existing options except Auto
            qualitySelect.innerHTML =
              '<option value="auto">Auto (ABR)</option>';

            // Build quality options from available levels
            const qualities = [];
            for (let i = 0; i < qualityLevels.length; i++) {
              const level = qualityLevels[i];
              if (level.height) {
                qualities.push({
                  index: i,
                  height: level.height,
                  bandwidth: level.bandwidth || 0,
                });
              }
            }

            // Sort by height descending and remove duplicates
            qualities.sort((a, b) => b.height - a.height);

            const uniqueQualities = [];
            const seenHeights = new Set();

            for (const q of qualities) {
              if (!seenHeights.has(q.height)) {
                seenHeights.add(q.height);
                uniqueQualities.push(q);
              }
            }

            // Add options to selector
            uniqueQualities.forEach((q) => {
              const option = document.createElement("option");
              option.value = q.index;
              option.textContent = `${q.height}p (${(
                q.bandwidth / 1000000
              ).toFixed(1)} Mbps)`;
              qualitySelect.appendChild(option);
            });

            console.log(
              `Quality selector populated with ${uniqueQualities.length} options`
            );
          }
        } catch (err) {
          console.debug("Quality selector error:", err.message);
        }
      }

      // 5. Handle Quality Selection
      qualitySelect.addEventListener("change", (e) => {
        try {
          const qualityLevels = player.qualityLevels();

          if (e.target.value === "auto") {
            // Enable ABR - enable all quality levels
            for (let i = 0; i < qualityLevels.length; i++) {
              qualityLevels[i].enabled = true;
            }
            setStatus("ABR Mode Active", "success");
          } else {
            // Lock to specific quality
            const selectedIndex = parseInt(e.target.value);
            for (let i = 0; i < qualityLevels.length; i++) {
              qualityLevels[i].enabled = i === selectedIndex;
            }
            const selectedQuality = qualityLevels[selectedIndex];
            if (selectedQuality && selectedQuality.height) {
              setStatus(`Locked to ${selectedQuality.height}p`, "success");
            }
          }
        } catch (err) {
          console.error("Quality change error:", err);
        }
      });

      // 6. Initialize Video.js Player
      player = videojs("player", {
        html5: {
          vhs: {
            overrideNative: true,
            enableLowInitialPlaylist: false,
          },
        },
      });

      player.on("loadedmetadata", () => {
        populateQualitySelector();
        setStatus("Stream Loaded", "success");
      });

      player.on("waiting", () => setStatus("Buffering...", "neutral"));

      player.on("playing", () => {
        setStatus("Playback Active", "success");
        if (!statsInterval) {
          statsInterval = setInterval(updateStats, 1000);
        }
      });

      player.on("pause", () => {
        if (statsInterval) {
          clearInterval(statsInterval);
          statsInterval = null;
        }
      });

      player.on("error", () => setStatus("Stream Error", "error"));

      // 7. Form Submit Handler
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const vid = document.getElementById("video-id").value.trim();
        const key = document.getElementById("api-key").value.trim();
        const isPublic = document.getElementById("public-toggle").checked;
        const baseUrl = baseInput.value.replace(/\/$/, "");

        if (!vid) {
          setStatus("Please enter a Video ID", "error");
          return;
        }

        // Inject API Key into XHR requests
        if (!isPublic && key) {
          videojs.Vhs.xhr.beforeRequest = function (options) {
            options.headers = options.headers || {};
            options.headers["X-API-KEY"] = key;
            return options;
          };
        } else {
          videojs.Vhs.xhr.beforeRequest = undefined;
        }

        const path = isPublic
          ? `/stream/public/${encodeURIComponent(vid)}/master.m3u8`
          : `/stream/${encodeURIComponent(vid)}/master.m3u8`;

        const fullUrl = `${baseUrl}${path}`;

        urlDisplay.textContent = fullUrl;
        setStatus("Loading Stream...", "neutral");

        player.src({
          src: fullUrl,
          type: "application/x-mpegURL",
        });

        player.play().catch((err) => {
          console.warn("Autoplay blocked:", err);
          setStatus("Ready to Play (Click Play)", "success");
        });
      });
    </script>
  </body>
</html>
