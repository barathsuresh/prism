<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prism Video Player</title>

    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

    <!-- Video.js Quality Selector Plugin CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/@silvermine/videojs-quality-selector@1.3.1/dist/css/quality-selector.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0b1c2c;
        --panel: #0f2438;
        --accent: #1f9e6d;
        --text: #e7f0f5;
        --muted: #92a8b6;
        --border: #1c3347;
        --danger: #f25f5c;
        font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background: radial-gradient(
            circle at 20% 20%,
            rgba(31, 158, 109, 0.2),
            transparent 35%
          ),
          radial-gradient(
            circle at 80% 0%,
            rgba(46, 91, 173, 0.25),
            transparent 32%
          ),
          #0b1c2c;
        min-height: 100vh;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
        display: flex;
        justify-content: center;
      }

      .card {
        width: min(1200px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }

      h1 {
        margin: 0 0 12px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      p.lead {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 14px;
      }

      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        align-items: end;
        margin-bottom: 24px;
      }

      label {
        font-size: 13px;
        color: var(--muted);
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
      }

      input,
      button {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 11px 14px;
        font-size: 14px;
        font-family: inherit;
        background: #0c2032;
        color: var(--text);
        transition: all 0.2s;
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(31, 158, 109, 0.1);
      }

      button {
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
        border: none;
      }

      button:hover {
        background: #1a8a5f;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(31, 158, 109, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      .checkbox-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
      }

      .checkbox-wrapper input[type="checkbox"] {
        width: auto;
        margin: 0;
        cursor: pointer;
      }

      .checkbox-wrapper label {
        margin: 0;
        cursor: pointer;
      }

      #status {
        padding: 12px 16px;
        background: #0c2032;
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 13px;
        color: var(--muted);
      }

      #status.error {
        background: rgba(242, 95, 92, 0.1);
        border-color: var(--danger);
        color: var(--danger);
      }

      #status.success {
        background: rgba(31, 158, 109, 0.1);
        border-color: var(--accent);
        color: var(--accent);
      }

      /* Video.js player customization */
      .video-container {
        margin-bottom: 24px;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
        position: relative;
      }

      .video-js {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
      }

      .vjs-big-play-button {
        border-radius: 50% !important;
        background: var(--accent) !important;
        border: none !important;
        width: 80px !important;
        height: 80px !important;
        font-size: 48px !important;
        line-height: 80px !important;
        left: 50% !important;
        top: 50% !important;
        transform: translate(-50%, -50%) !important;
        margin: 0 !important;
      }

      .vjs-big-play-button:hover {
        background: #1a8a5f !important;
      }
      #quality-selector:hover {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(31, 158, 109, 0.2);
      }

      #quality-selector:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(31, 158, 109, 0.3);
        font-family: inherit;
      }

      /* Stats panel */
      .stats-panel {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        margin-top: 20px;
      }

      .stat-card {
        padding: 14px 16px;
        background: #0c2032;
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .stat-label {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .stat-value {
        font-size: 18px;
        font-weight: 600;
        color: var(--accent);
      }

      @media (max-width: 720px) {
        body {
          padding: 16px;
        }

        form {
          grid-template-columns: 1fr;
        }

        .stats-panel {
          grid-template-columns: 1fr;
        }

        .vjs-big-play-button {
          width: 60px !important;
          height: 60px !important;
          font-size: 36px !important;
          line-height: 60px !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="card">
      <h1>🎬 Prism Stream Player</h1>
      <p class="lead">
        Professional HLS streaming with adaptive bitrate, quality selection, and
        optimized buffering for Docker environments.
      </p>

      <form id="player-form">
        <div>
          <label for="base-url">Gateway Base URL</label>
          <input
            id="base-url"
            name="base-url"
            type="url"
            placeholder="http://localhost:8080"
            value="http://localhost:8080"
            autocomplete="url"
            required
          />
        </div>

        <div>
          <label for="video-id">Video ID</label>
          <input
            id="video-id"
            name="video-id"
            type="text"
            placeholder="vid_..."
            autocomplete="off"
            required
          />
        </div>

        <div>
          <label for="api-key">API Key (videos:read)</label>
          <input
            id="api-key"
            name="api-key"
            type="text"
            placeholder="pk_xxx:sk_xxx"
            autocomplete="off"
          />
        </div>

        <div
          style="
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
          "
        >
          <div class="checkbox-wrapper">
            <input id="public-toggle" name="public-toggle" type="checkbox" />
            <label for="public-toggle">Use public endpoint</label>
          </div>
          <button type="submit">▶ Load & Play</button>
        </div>
      </form>

      <div id="status">⏳ Waiting for input...</div>

      <div class="video-container">
        <video
          id="player"
          class="video-js vjs-big-play-centered"
          controls
          preload="auto"
          playsinline
          crossorigin="anonymous"
        ></video>
      </div>

      <div class="stats-panel" id="stats-panel">
        <div class="stat-card">
          <div class="stat-label">Current Quality</div>
          <div class="stat-value" id="current-quality">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Buffer Health</div>
          <div class="stat-value" id="buffer-health">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Bitrate</div>
          <div class="stat-value" id="bitrate">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Dropped Frames</div>
          <div class="stat-value" id="dropped-frames">-</div>
        </div>
      </div>
    </main>

    <!-- Video.js Core -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <!-- HLS.js (standalone for manual control) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.14/dist/hls.min.js"></script>

    <!-- Video.js Quality Selector Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/@silvermine/videojs-quality-selector@1.3.1/dist/js/silvermine-videojs-quality-selector.min.js"></script>

    <script>
      const form = document.getElementById("player-form");
      const baseInput = document.getElementById("base-url");
      const videoIdInput = document.getElementById("video-id");
      const apiKeyInput = document.getElementById("api-key");
      const publicToggle = document.getElementById("public-toggle");
      const statusEl = document.getElementById("status");

      let player = null;
      let hlsInstance = null;
      let statsInterval = null;

      // Cleanup function
      function cleanup() {
        // Clear stats interval
        if (statsInterval) {
          clearInterval(statsInterval);
          statsInterval = null;
        }

        // Destroy HLS instance
        if (hlsInstance) {
          hlsInstance.destroy();
          hlsInstance = null;
        }

        // Dispose video.js player
        if (player) {
          player.dispose();
          player = null;
        }

        // Remove custom quality selector
        const existingSelector = document.getElementById(
          "quality-selector-wrapper"
        );
        if (existingSelector) {
          existingSelector.remove();
        }

        // Reset stats
        document.getElementById("current-quality").textContent = "-";
        document.getElementById("buffer-health").textContent = "-";
        document.getElementById("bitrate").textContent = "-";
        document.getElementById("dropped-frames").textContent = "-";
      }

      // Initialize Video.js player
      function initPlayer() {
        // Clean up any existing player first
        cleanup();

        player = videojs("player", {
          controls: true,
          preload: "auto",
          fluid: false,
          responsive: true,
          html5: {
            vhs: {
              overrideNative: true,
              enableLowInitialPlaylist: false,
              smoothQualityChange: true,
              fastQualityChange: true,
            },
            nativeAudioTracks: false,
            nativeVideoTracks: false,
          },
        });

        // Note: Quality selector added after HLS is initialized
      }

      function setStatus(message, type = "info") {
        statusEl.textContent = message;
        statusEl.className =
          type === "error" ? "error" : type === "success" ? "success" : "";
      }

      function buildEndpoint(baseUrl, videoId, isPublic) {
        const trimmedBase = baseUrl.endsWith("/")
          ? baseUrl.slice(0, -1)
          : baseUrl;
        const path = isPublic
          ? `/stream/public/${encodeURIComponent(videoId)}/master.m3u8`
          : `/stream/${encodeURIComponent(videoId)}/master.m3u8`;
        return `${trimmedBase}${path}`;
      }

      function updateStats() {
        if (!player || !hlsInstance) return;

        try {
          // Current quality
          const currentLevel = hlsInstance.currentLevel;
          if (currentLevel >= 0 && hlsInstance.levels[currentLevel]) {
            const level = hlsInstance.levels[currentLevel];
            document.getElementById("current-quality").textContent = `${
              level.height
            }p (${Math.round(level.bitrate / 1000)}kbps)`;
          } else {
            document.getElementById("current-quality").textContent = "Auto";
          }

          // Buffer health
          const buffered = player.buffered();
          if (buffered.length > 0) {
            const bufferEnd = buffered.end(buffered.length - 1);
            const currentTime = player.currentTime();
            const bufferLength = bufferEnd - currentTime;
            document.getElementById(
              "buffer-health"
            ).textContent = `${bufferLength.toFixed(1)}s`;
          }

          // Bitrate
          if (currentLevel >= 0 && hlsInstance.levels[currentLevel]) {
            const bitrate = hlsInstance.levels[currentLevel].bitrate;
            document.getElementById("bitrate").textContent = `${(
              bitrate / 1000000
            ).toFixed(2)} Mbps`;
          }

          // Dropped frames
          const stats = player.tech({ IWillNotUseThisInPlugins: true }).vhs
            ?.stats;
          if (stats) {
            document.getElementById("dropped-frames").textContent =
              stats.droppedFrames || "0";
          }
        } catch (err) {
          console.warn("Stats update error:", err);
        }
      }

      function createQualitySelector(levels) {
        // Remove existing selector if any
        const existingSelector = document.getElementById(
          "quality-selector-wrapper"
        );
        if (existingSelector) {
          existingSelector.remove();
        }

        // Create quality selector UI
        const selector = document.createElement("div");
        selector.id = "quality-selector-wrapper";
        selector.style.cssText = `
          position: absolute;
          top: 16px;
          right: 16px;
          z-index: 1000;
        `;

        const select = document.createElement("select");
        select.id = "quality-selector";
        select.style.cssText = `
          padding: 8px 12px;
          background: rgba(15, 36, 56, 0.95);
          border: 1px solid var(--border);
          border-radius: 8px;
          color: var(--text);
          font-family: inherit;
          font-size: 13px;
          cursor: pointer;
          font-weight: 500;
        `;

        // Add auto option
        const autoOption = document.createElement("option");
        autoOption.value = "-1";
        autoOption.textContent = "Auto (ABR)";
        select.appendChild(autoOption);

        // Add quality levels
        levels.forEach((level, index) => {
          const option = document.createElement("option");
          option.value = index;
          option.textContent = `${level.height}p (${Math.round(
            level.bitrate / 1000
          )}kbps)`;
          select.appendChild(option);
        });

        select.value = "-1"; // Default to auto

        select.addEventListener("change", (e) => {
          const selectedLevel = parseInt(e.target.value);
          hlsInstance.currentLevel = selectedLevel;
          console.log(
            `Quality manually set to: ${
              selectedLevel === -1 ? "Auto" : levels[selectedLevel].height + "p"
            }`
          );
          updateStats();
        });

        selector.appendChild(select);
        document.querySelector(".video-container").appendChild(selector);
      }

      function loadVideo(endpoint, apiKey, isPublic) {
        initPlayer();

        if (Hls.isSupported()) {
          // HLS.js with advanced ABR configuration
          hlsInstance = new Hls({
            debug: false,
            enableWorker: true,
            lowLatencyMode: false,
            backBufferLength: 90,

            // Aggressive buffering for Docker network latency
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            maxBufferSize: 60 * 1000 * 1000,
            maxBufferHole: 0.5,

            // ABR Configuration
            abrEwmaDefaultEstimate: 500000,
            abrEwmaFastLive: 3.0,
            abrEwmaSlowLive: 9.0,
            abrEwmaFastVoD: 3.0,
            abrEwmaSlowVoD: 9.0,
            abrBandWidthFactor: 0.95,
            abrBandWidthUpFactor: 0.7,
            abrMaxWithRealBitrate: false,

            // Error recovery
            manifestLoadingTimeOut: 10000,
            manifestLoadingMaxRetry: 4,
            manifestLoadingRetryDelay: 1000,
            levelLoadingTimeOut: 10000,
            levelLoadingMaxRetry: 4,
            fragLoadingTimeOut: 20000,
            fragLoadingMaxRetry: 6,

            // Stall detection
            highBufferWatchdogPeriod: 2,
            nudgeOffset: 0.1,
            nudgeMaxRetry: 3,
            maxFragLookUpTolerance: 0.25,

            // XHR setup for auth
            xhrSetup: (xhr) => {
              if (!isPublic && apiKey) {
                xhr.setRequestHeader("X-API-Key", apiKey);
              }
            },
          });

          // Event handlers
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
            setStatus(
              `✅ Manifest loaded. ${data.levels.length} quality levels available.`,
              "success"
            );

            // Create custom quality selector
            createQualitySelector(hlsInstance.levels);

            // Auto-select best quality initially
            hlsInstance.currentLevel = -1; // Auto mode

            console.log("Available qualities:", hlsInstance.levels);
          });

          hlsInstance.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {
            console.log(
              `Quality switched to: ${hlsInstance.levels[data.level].height}p`
            );
            updateStats();
          });

          hlsInstance.on(Hls.Events.ERROR, (event, data) => {
            console.error("HLS Error:", data);

            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  setStatus("❌ Network error. Retrying...", "error");
                  hlsInstance.startLoad();
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  setStatus("❌ Media error. Recovering...", "error");
                  hlsInstance.recoverMediaError();
                  break;
                default:
                  setStatus(`❌ Fatal error: ${data.details}`, "error");
                  hlsInstance.destroy();
                  break;
              }
            }
          });

          hlsInstance.on(Hls.Events.FRAG_BUFFERED, () => {
            updateStats();
          });

          // Load and attach
          hlsInstance.loadSource(endpoint);
          hlsInstance.attachMedia(
            player.tech({ IWillNotUseThisInPlugins: true }).el()
          );

          // Start stats monitoring
          if (statsInterval) clearInterval(statsInterval);
          statsInterval = setInterval(updateStats, 1000);
        } else if (player.canPlayType("application/vnd.apple.mpegurl")) {
          // Native HLS support (Safari)
          player.src({
            src: endpoint,
            type: "application/x-mpegURL",
          });
          setStatus("✅ Using native HLS (Safari)", "success");
        } else {
          setStatus("❌ HLS not supported in this browser", "error");
          return;
        }

        // Player event listeners
        player.on("loadedmetadata", () => {
          console.log("Video metadata loaded");
        });

        player.on("canplay", () => {
          setStatus("▶ Ready to play", "success");
        });

        player.on("playing", () => {
          setStatus("▶ Playing...", "success");
        });

        player.on("waiting", () => {
          setStatus("⏳ Buffering...", "info");
        });

        player.on("error", (err) => {
          const error = player.error();
          setStatus(`❌ Player error: ${error?.message || "Unknown"}`, "error");
        });
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const videoId = videoIdInput.value.trim();
        const apiKey = apiKeyInput.value.trim();
        const isPublic = publicToggle.checked;
        const baseUrl = baseInput.value.trim() || window.location.origin;

        if (!videoId) {
          setStatus("⚠ Please enter a video ID.", "error");
          return;
        }

        if (!isPublic && !apiKey) {
          setStatus("⚠ Provide an API key or switch to public mode.", "error");
          return;
        }

        const endpoint = buildEndpoint(baseUrl, videoId, isPublic);
        setStatus(`🔄 Loading video from ${endpoint}...`, "info");

        try {
          loadVideo(endpoint, apiKey, isPublic);
        } catch (err) {
          console.error(err);
          setStatus(`❌ Error: ${err.message}`, "error");
        }
      });

      // Cleanup on page unload
      window.addEventListener("beforeunload", cleanup);
    </script>
  </body>
</html>
