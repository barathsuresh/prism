services:
  # 1. MongoDB
  mongo:
    image: mongo:latest
    container_name: prism-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db  # <--- Changed to named volume
    networks:
      - prism-network

  # 2. RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: prism-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq # <--- Good practice to persist queues too
    networks:
      - prism-network

  # 3. MinIO
  minio:
    image: minio/minio
    container_name: prism-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data  # <--- Changed to named volume
    networks:
      - prism-network

  # 4. Zipkin (Usually doesn't need persistence for dev, but we can add it if needed)
  zipkin:
    image: openzipkin/zipkin
    container_name: prism-zipkin
    ports:
      - "9411:9411"
    networks:
      - prism-network

  # 5. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prism-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - prism-network

  # 6. Loki
  loki:
    image: grafana/loki:latest
    container_name: prism-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - prism-network

  # 7. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: prism-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/spring-boot-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    networks:
      - prism-network

  # ============================================
  # APPLICATION MICROSERVICES
  # ============================================

  # 8. Eureka Discovery Server
  prism-discovery:
    build:
      context: ./prism-discovery
      dockerfile: Dockerfile
    container_name: prism-discovery
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: prism-discovery
      EUREKA_CLIENT_REGISTERWITEUREKA: "false"
      EUREKA_CLIENT_FETCHREGISTRY: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - prism-network

  # 9. Config Server
  prism-config:
    build:
      context: ./prism-config
      dockerfile: Dockerfile
    container_name: prism-config
    ports:
      - "8888:8888"
    environment:
      SPRING_APPLICATION_NAME: prism-config
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: file:///app/config-repo
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_HOST}:${EUREKA_PORT}/eureka/
    volumes:
      - ./config-repo:/app/config-repo:ro
    depends_on:
      prism-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - prism-network

  # 10. API Gateway
  prism-gateway:
    build:
      context: ./prism-gateway
      dockerfile: Dockerfile
    container_name: prism-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: prism-gateway
      SPRING_CLOUD_CONFIG_URI: http://prism-config:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_HOST}:${EUREKA_PORT}/eureka/
      MONGO_URI: mongodb://mongo:27017/prism-gateway-db
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIPKIN_ENDPOINT}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_ENDPOINT}/api/v2/spans
      LOKI_URL: ${LOKI_URL}
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      prism-discovery:
        condition: service_healthy
      prism-config:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1280M
        reservations:
          memory: 1024M
    networks:
      - prism-network

  # 11. Auth Service
  prism-auth:
    build:
      context: ./prism-auth
      dockerfile: Dockerfile
    container_name: prism-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: prism-auth
      SPRING_CLOUD_CONFIG_URI: http://prism-config:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_HOST}:${EUREKA_PORT}/eureka/
      MONGO_URI: mongodb://mongo:27017/prism-auth-db
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIPKIN_ENDPOINT}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_ENDPOINT}/api/v2/spans
      LOKI_URL: ${LOKI_URL}
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      prism-discovery:
        condition: service_healthy
      prism-config:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - prism-network

  # 12. Catalog Service
  prism-catalog:
    build:
      context: ./prism-catalog
      dockerfile: Dockerfile
    container_name: prism-catalog
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: prism-catalog
      SPRING_CLOUD_CONFIG_URI: http://prism-config:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_HOST}:${EUREKA_PORT}/eureka/
      MONGO_URI: mongodb://mongo:27017/prism-catalog-db
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIPKIN_ENDPOINT}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_ENDPOINT}/api/v2/spans
      LOKI_URL: ${LOKI_URL}
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      prism-discovery:
        condition: service_healthy
      prism-config:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - prism-network

  # 13. Upload Service
  prism-upload:
    build:
      context: ./prism-upload
      dockerfile: Dockerfile
    container_name: prism-upload
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: prism-upload
      SPRING_CLOUD_CONFIG_URI: http://prism-config:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_HOST}:${EUREKA_PORT}/eureka/
      MONGO_URI: mongodb://mongo:27017/prism-upload-db
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIPKIN_ENDPOINT}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_ENDPOINT}/api/v2/spans
      LOKI_URL: ${LOKI_URL}
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      prism-discovery:
        condition: service_healthy
      prism-config:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1280M
        reservations:
          memory: 1024M
    networks:
      - prism-network

  # 14. Transcoder Service
  prism-transcoder:
    build:
      context: ./prism-transcoder
      dockerfile: Dockerfile
    container_name: prism-transcoder
    ports:
      - "8084:8084"
    environment:
      SPRING_APPLICATION_NAME: prism-transcoder
      SPRING_CLOUD_CONFIG_URI: http://prism-config:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_HOST}:${EUREKA_PORT}/eureka/
      MONGO_URI: mongodb://mongo:27017/prism-transcoder-db
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIPKIN_ENDPOINT}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_ENDPOINT}/api/v2/spans
      LOKI_URL: ${LOKI_URL}
    depends_on:
      prism-discovery:
        condition: service_healthy
      prism-config:
        condition: service_healthy
      prism-upload:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 1536M
    networks:
      - prism-network

  # 15. Stream Service
  prism-stream:
    build:
      context: ./prism-stream
      dockerfile: Dockerfile
    container_name: prism-stream
    ports:
      - "8085:8085"
    environment:
      SPRING_APPLICATION_NAME: prism-stream
      SPRING_CLOUD_CONFIG_URI: http://prism-config:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_HOST}:${EUREKA_PORT}/eureka/
      MONGO_URI: mongodb://mongo:27017/prism-stream-db
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ZIPKIN_ENDPOINT}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_ENDPOINT}/api/v2/spans
      LOKI_URL: ${LOKI_URL}
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      prism-discovery:
        condition: service_healthy
      prism-config:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    networks:
      - prism-network

# Define the volumes here so Docker manages them
volumes:
  mongo_data:
  minio_data:
  rabbitmq_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  prism-network:
    driver: bridge