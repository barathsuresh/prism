logging:
  level:
    com.prism: DEBUG
spring:
  application:
    name: prism-stream
server:
  port: 8085 # Runs on 8085

# Custom MinIO Config
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: prism-videos
  region: us-east-1
  max-file-size: 5368709120 # 5GB
  presigned-url-expiration-minutes: 720 # 12 hours

# enable or disable stream redirection to minio presigned URLs
stream:
  redirect:
    enabled: false

management:
  tracing:
    sampling:
      probability: 1
  endpoints:
    web:
      exposure:
        include: "*"
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}
