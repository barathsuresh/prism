logging:
  level:
    com.prism: DEBUG

spring:
  application:
    name: prism-gateway
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017}/prism-gateway-db
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

example:
  message: "Hello from the Config Server!"

springdoc:
  swagger-ui:
    # This disables the default petstore URL
    disable-swagger-default-url: true
    path: swagger.html
    # List all your microservices here
    urls:
      - name: Auth Service
        url: /api/auth/v3/api-docs
      - name: Upload Service
        url: /api/upload/v3/api-docs
      - name: Catalog Service
        url: /api/catalog/v3/api-docs
      - name: Stream Service
        url: /api/stream/v3/api-docs
      - name: Transcoder Service
        url: /api/transcoder/v3/api-docs
  api-docs:
    enabled: true
    path: /v3/api-docs

# API key enforcement configuration (used by ApiKeyValidationFilter global filter)
gateway:
  apikey:
    # Define route patterns and required scopes for those requests
    enforcement:
      # All internal service-to-service endpoints (no API key required)
      - path: /api/**/internal/**
        scopes: [ ]

      # All API docs endpoints (no API key required)
      - path: /api/**/v3/api-docs
        scopes: []

      # Public catalog endpoints (no API key required)
      - path: /api/catalog/videos/public/**
        scopes: []

      # Public stream endpoints (no API key required)
      - path: /api/stream/public/**
        method: GET
        scopes: []

      # Smart proxy public endpoints (no API key required)
      - path: /stream/public/**
        method: GET
        scopes: []

      # Upload progress endpoint (no API key required for SSE)
      - path: /api/upload/**/progress
        method: GET
        scopes: []

      # Upload service - write operations (videos:upload scope)
      - path: /api/upload/**
        method: POST
        scopes: ["videos:upload"]
      - path: /api/upload/**
        method: PUT
        scopes: ["videos:upload"]

      # Catalog service - read operations (catalog:read scope)
      - path: /api/catalog/videos/**
        method: GET
        scopes: ["catalog:read"]

      # Catalog service - write operations (catalog:write scope)
      - path: /api/catalog/videos/**
        method: POST
        scopes: ["catalog:write"]
      - path: /api/catalog/videos/**
        method: PUT
        scopes: ["catalog:write"]
      - path: /api/catalog/videos/**
        method: DELETE
        scopes: ["catalog:write"]

      # Stream service - read only (videos:read scope)
      - path: /api/stream/**
        method: GET
        scopes: ["videos:read"]

      # Smart proxy private endpoints - read only (videos:read scope)
      - path: /stream/**
        method: GET
        scopes: ["videos:read"]

management:
  tracing:
    export:
      zipkin:
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
    sampling:
      probability: 1
  endpoints:
    web:
      exposure:
        include: "*"
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}
