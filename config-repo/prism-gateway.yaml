example:
  message: "Hello from the Config Server!"
spring:
  cloud:
    gateway:
      routes:
        - id: google-test
          uri: https://google.com
          predicates:
            - Path=/google
# API key enforcement configuration
gateway:
  apiKey:
    # Define route patterns and required scopes for those requests
    enforcement:
      - path: /api/upload/**
        scopes: ["videos:upload"]
      - path: /api/catalog/**
        scopes: ["videos:read"]
      - path: /api/stream/**
        scopes: ["videos:read"]