logging:
  level:
    com.prism: DEBUG
server:
  port: 8082 # Catalog runs on 8082

spring:
  application:
    name: prism-catalog
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017}/prism-catalog-db
  data:
    mongodb:
      auto-index-creation: true

management:
  tracing:
    export:
      zipkin:
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
    sampling:
      probability: 1
  endpoints:
    web:
      exposure:
        include: "*"
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}
