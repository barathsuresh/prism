logging:
  level:
    com.prism: DEBUG
server:
  port: 8081

spring:
  application:
    name: prism-auth
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017}/prism-auth-db
  data:
    auto:
      index-creation: true
  # JWT configuration for prism-auth service
app:
  jwt:
    # Secret key for signing tokens; override via environment variable JWT_SECRET
    secret: ${JWT_SECRET:change-this-in-production}
    issuer: prism-auth
    audience: prism
    expiration: 86400s # 24 hours (Spring Duration format)

springdoc:
  swagger-ui:
    path: /api/auth/v3/swagger-ui.html
  api-docs:
    enabled: true
    path: /api/auth/v3/api-docs

management:
  tracing:
    export:
      zipkin:
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
    sampling:
      probability: 1
  endpoints:
    web:
      exposure:
        include: "*"
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}
