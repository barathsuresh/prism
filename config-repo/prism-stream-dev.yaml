logging:
  level:
    com.prism: DEBUG

spring:
  application:
    name: prism-stream
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017}/prism-stream-db
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

springdoc:
  swagger-ui:
    path: /api/stream/v3/swagger-ui.html
  api-docs:
    enabled: true
    path: /api/stream/v3/api-docs

server:
  port: 8085 # Runs on 8085

# Custom MinIO Config
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: prism-videos
  region: us-east-1
  max-file-size: 5368709120 # 5GB
  presigned-url-expiration-minutes: 720 # 12 hours

# enable or disable stream redirection to minio presigned URLs
stream:
  redirect:
    enabled: false

management:
  tracing:
    export:
      zipkin:
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
    sampling:
      probability: 1
  endpoints:
    web:
      exposure:
        include: "*"
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}
