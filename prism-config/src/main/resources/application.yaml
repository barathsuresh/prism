spring:
  application:
    name: prism-config
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
#          search-locations: file:${user.dir}/../config-repo
            search-locations: file:D://Spring Boot Projects//prism//config-repo
server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus: 
    metrics:
      export:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}

